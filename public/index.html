<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Open Props • Nudeps on this host</title>

	<!-- Neither file is committed: nudeps creates both during the host build -->
	<link rel="stylesheet" href="nudeps/open-props/open-props.min.css" />
	<script src="importmap.js"></script>

	<style>
		body {
			font-family: var(--font-sans, serif);
			max-inline-size: 40rem;
			margin-inline: auto;
			padding: var(--size-5, 1rem);
			color: var(--gray-9);
		}

		h1 {
			color: var(--indigo-7);
		}

		.card {
			padding: var(--size-4);
			border-radius: var(--radius-3);
			box-shadow: var(--shadow-3);
			background: var(--gray-0);
		}

		/* Plain colors, so the verdict stays readable when Open Props fails to load */
		li {
			margin-block: 0.5em;
			padding: 0.5em 1em;
			border-radius: 0.5em;
			background: oklch(95% 0 0);
			list-style: none;

			&.pass {
				background: oklch(90% 0.1 145);
			}

			&.fail {
				background: oklch(88% 0.1 25);
			}
		}

		ul {
			padding: 0;
		}

		output {
			font-weight: bold;
		}

		.gradient-box {
			block-size: var(--size-10);
			background: var(--gradient-12);
			border-radius: var(--radius-3);
			animation: var(--animation-fade-in);
		}

		.swatches {
			display: flex;
			flex-wrap: wrap;
			gap: var(--size-2);
			margin-block-start: var(--size-3);
		}

		.swatch {
			inline-size: var(--size-8);
			block-size: var(--size-8);
			border-radius: var(--radius-2);
			box-shadow: var(--shadow-2);
		}

		code {
			background: var(--gray-2);
			padding: var(--size-1) var(--size-2);
			border-radius: var(--radius-2);
			font-size: var(--font-size-1);
		}
	</style>
</head>
<body>
	<h1>Open Props, installed by nudeps on this host</h1>

	<ul>
		<li id="css">
			CSS through the nudeps alias <code>nudeps/open-props/</code>
			<output>checking…</output>
		</li>
		<li id="js">
			JS through the import map: <code>import props from "open-props"</code>
			<output>checking…</output>
		</li>
	</ul>

	<div class="card">
		<p>The gradient needs the CSS. The swatches are built from the imported JS.</p>
		<div class="gradient-box"></div>
		<div class="swatches"></div>
	</div>

	<p><a href="checks.html">Detailed symlink checks</a></p>

	<script type="module">
		function report (id, ok, detail) {
			let item = document.getElementById(id);
			item.classList.add(ok ? "pass" : "fail");
			item.querySelector("output").textContent = `${ok ? "PASS" : "FAIL"} (${detail})`;
		}

		let indigo = getComputedStyle(document.body).getPropertyValue("--indigo-7");
		report("css", indigo !== "", indigo ? `--indigo-7 is ${indigo}` : "Open Props did not load");

		try {
			let { default: props } = await import("open-props");
			let hues = ["red", "orange", "yellow", "green", "cyan", "blue", "indigo", "violet", "purple", "pink"];

			for (let hue of hues) {
				let swatch = document.createElement("div");
				swatch.className = "swatch";
				swatch.style.background = props[`--${hue}-5`];
				document.querySelector(".swatches").append(swatch);
			}

			report("js", true, `${Object.keys(props).length} props imported`);
		}
		catch (error) {
			report("js", false, error.message);
		}
	</script>
</body>
</html>
